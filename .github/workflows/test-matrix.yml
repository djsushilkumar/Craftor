name: Docker Multi-Version Matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix-test:
    name: PHP ${{ matrix.php }} x WP ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
        wordpress: ['6.0', '6.2', '6.4', '6.5']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo, pdo_mysql

      - name: Validate Plugin Syntax
        run: |
          php -l plugins/craftor-core/craftor-core.php
          php -l plugins/craftor-pro/craftor-pro.php
          php -l plugins/craftor-enterprise/craftor-enterprise.php
