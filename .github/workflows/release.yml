name: Release Packages & Plugins

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Packages
        run: pnpm build

      - name: Check for Pending Changesets
        id: check_changesets
        shell: bash
        run: |
          CHANGESET_COUNT=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)
          echo "changeset_count=$CHANGESET_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$CHANGESET_COUNT" -gt "0" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "✅ Found $CHANGESET_COUNT pending changeset(s)."
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "✅ No pending changesets. Skipping release."
          fi

      - name: Create Release Pull Request or Publish
        if: steps.check_changesets.outputs.has_changesets == 'true'
        uses: changesets/action@v1
        continue-on-error: true
        with:
          title: 'chore(release): version packages and update changelogs'
          commit: 'chore(release): version packages [skip ci]'
          publish: pnpm release
          version: pnpm version-packages
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

